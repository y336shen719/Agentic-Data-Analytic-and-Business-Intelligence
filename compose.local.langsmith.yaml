# Optional overlay: include after compose.local.yaml to enable tracing.
services:
  app:
    environment:
      LANGSMITH_TRACING: "true"
      LANGCHAIN_TRACING_V2: "true"
      LANGSMITH_API_KEY_FILE: /run/secrets/langsmith_api_key
      LANGSMITH_PROJECT: agentic-data-analyst
    secrets:
      - langsmith_api_key

secrets:
  langsmith_api_key:
    file: ${ADA_SECRETS_DIR:?Set ADA_SECRETS_DIR to an absolute directory outside the repository}/langsmith_api_key
