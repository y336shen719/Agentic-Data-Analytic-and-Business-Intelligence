name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest (Linux, Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - name: Check out code and tracked database
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-docker.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements-docker.lock
          python -m pip check
      - name: Verify the LFS database opens read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import duckdb

          path = Path("data/ecommerce.duckdb")
          assert path.is_file(), "LFS database is missing."
          with duckdb.connect(str(path), read_only=True) as connection:
              assert connection.execute("SHOW TABLES").fetchall(), "Database has no tables."
          print("LFS database opened read-only and contains tables.")
          PY
      - name: Run all tests without external network access
        run: python -B -m pytest --offline -q -ra -p no:cacheprovider

  build:
    name: Build Linux AMD64 image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tested code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: agentic-data-analyst:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
